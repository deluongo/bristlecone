name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # commit stamps (spec §4) need full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the archive with spec §4 commit stamps
        run: python -m bristlecone render records/ -o _site --stamps
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # GitHub Pages cannot serve a private repo on the free plan, so the deploy
    # arms itself at the public flip; until then the build job still proves
    # every push to main renders with stamps.
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
