[project]
name = "bristlecone"
version = "0.1.0.dev0"
description = "Tools for the Bristlecone record format: an open, git-native, model-attributed deliberation archive"
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bristlecone --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["bristlecone"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
